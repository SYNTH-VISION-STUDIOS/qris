<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QPay — Pembayaran QRIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <small class="opacity-75">Saldo tersedia</small>
      <h3 class="mb-0">Rp 1.250.000</h3>
    </div>
    <div class="avatar">Q</div>
  </header>

  <main class="container py-4">
    <section class="hero-card">
      <div>
        <span class="badge-soft">QRIS PAYMENT</span>
        <h1>Bayar cepat,<br>cukup scan QR.</h1>
        <p>Prototype pembayaran QRIS untuk latihan.</p>
      </div>
      <div class="qr-icon">⌁</div>
    </section>

    <button class="scan-btn" onclick="location.href='scan.html'">
      <span class="scan-symbol">▣</span>
      <span><b>Scan QRIS</b><small>Scan kode untuk membayar</small></span>
      <span class="arrow">›</span>
    </button>

    <div class="section-title">
      <h5>Menu</h5>
    </div>
    <div class="menu-grid">
      <a href="scan.html" class="menu-item"><span>📷</span><b>Scan</b></a>
      <a href="history.html" class="menu-item"><span>🧾</span><b>Riwayat</b></a>
    </div>

    <div class="section-title">
      <h5>Catatan</h5>
    </div>
    <div class="notice">
      <b>Mode prototype</b>
      <p>Transaksi di aplikasi ini hanya simulasi dan tidak memindahkan uang sungguhan.</p>
    </div>
  </main>
</div>
</body>
</html>
