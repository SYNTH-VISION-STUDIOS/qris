<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scan QRIS — QPay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="simple-header">
    <a href="index.html">‹</a><h5>Scan QRIS</h5><span></span>
  </header>

  <main class="container py-3">
    <div id="reader" class="scanner"></div>
    <div class="scanner-help">
      <b>Arahkan kamera ke QRIS</b>
      <p>Pastikan seluruh kode QR terlihat di dalam kotak.</p>
    </div>

    <div class="divider"><span>atau</span></div>

    <button class="secondary-btn" onclick="demoScan()">Gunakan QR Demo</button>
    <p id="scanStatus" class="text-center small text-muted mt-3"></p>
  </main>
</div>
</body>
</html>
