<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pembayaran Berhasil — QPay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
<div class="app-shell">
  <main class="container py-5">
    <div class="success-card">
      <div class="check">✓</div>
      <p class="text-muted mb-1">Pembayaran berhasil</p>
      <h1 id="successAmount">Rp 0</h1>
      <div class="receipt">
        <div><span>Merchant</span><b id="successMerchant">Toko Demo</b></div>
        <div><span>Metode</span><b>QRIS</b></div>
        <div><span>Waktu</span><b id="successTime">-</b></div>
        <div><span>Status</span><b>BERHASIL</b></div>
      </div>
      <button class="primary-btn" onclick="location.href='index.html'">Kembali ke Beranda</button>
      <button class="secondary-btn mt-2" onclick="location.href='history.html'">Lihat Riwayat</button>
    </div>
  </main>
</div>
</body>
</html>
